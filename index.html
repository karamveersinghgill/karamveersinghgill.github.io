<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karam Veer Singh</title>
<style>
  :root {
    --bg-top: #181A1F;
    --bg-bot: #0F1013;
    --gold-frame: #B8934F;
    --gold-bright: #D9B876;
    --gold-text: #C9A35A;
    --ivory: #F6F3EA;
    --grey-light: #C6C2B6;
    --grey-med: #8A8E97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-top), var(--bg-bot));
    font-family: Arial, Helvetica, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    border: 1px solid var(--gold-frame);
    padding: 36px 28px;
    text-align: center;
  }
  .avatar {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold-text);
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ivory);
    font-size: 26px;
    margin: 0 0 6px;
    font-weight: 700;
  }
  .title {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold-bright);
    font-size: 15px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--grey-light);
    font-size: 12px;
    margin: 0 0 28px;
    letter-spacing: 0.3px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 12px;
    border: 1px solid var(--gold-frame);
    color: var(--ivory);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0.5px;
    transition: background 0.2s ease;
  }
  .btn:hover { background: rgba(184, 147, 79, 0.15); }
  .btn.primary {
    background: var(--gold-text);
    color: #14151A;
    border-color: var(--gold-text);
    font-weight: bold;
  }
  .btn.primary:hover { background: var(--gold-bright); }
  .footer {
    margin-top: 26px;
    color: var(--grey-med);
    font-size: 10px;
    letter-spacing: 1px;
  }
  .contact {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(184, 147, 79, 0.35);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .contact a {
    color: var(--grey-light);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .contact a:hover { color: var(--gold-bright); }
</style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="./profile.jpg" alt="Karam Veer Singh">
    <h1>Karam Veer Singh</h1>
    <p class="title">Project Scientist (Doctoral Candidate)</p>
    <p class="sub">Semiconductor Process Development &middot; Thin-Film Deposition &middot; Equipment Integration &amp; Commissioning</p>

    <a class="btn primary" href="https://www.linkedin.com/in/karamveersinghgill" target="_blank" rel="noopener">View LinkedIn Profile</a>
    <a class="btn" href="./KaramVeerSingh_CV.pdf" target="_blank" rel="noopener">View / Download CV</a>
    <a class="btn" href="./KaramVeerSingh.vcf" download="KaramVeerSingh.vcf">Save Contact</a>

    <div class="contact">
      <a href="tel:+917578802757">+91 7578 802 757</a>
      <a href="mailto:karamveer@iitb.ac.in">karamveer@iitb.ac.in</a>
    </div>

    <p class="footer">INDIAN INSTITUTE OF TECHNOLOGY BOMBAY</p>
  </div>
</body>
</html>
